    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Background color */
            color: #333; /* Default font color */
        }
        /* Main container style */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* Shadow effect */
        }
        /* Input group style */
        .input-group {
            position: relative; /* Ensure relative positioning for watermarks */
        }
        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #4a5568; /* Label font color */
        }
        .input-group input, .input-group select {
            border: 1px solid #cbd5e0; /* Border */
            border-radius: 8px; /* Rounded corners */
            padding: 10px 15px;
            font-size: 1rem;
            width: 100%;
            transition: border-color 0.2s; /* Transition effect */
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #4299e1; /* Focus border color */
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); /* Focus shadow */
        }
        /* Make readonly inputs look distinct */
        .input-group input[readonly] {
            background-color: #e2e8f0; /* Lighter background for readonly */
            cursor: not-allowed;
            color: #718096;
        }
        /* Button style */
        .button {
            background-color: #4299e1; /* Button background color */
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s; /* Animation effect */
            box-shadow: 0 4px 10px rgba(66, 153, 225, 0.3); /* Button shadow */
        }
        .button:hover {
            background-color: #3182ce; /* Hover background color */
            transform: translateY(-1px); /* Move up slightly */
        }
        .button:active {
            transform: translateY(0); /* Reset on click */
            box-shadow: 0 2px 5px rgba(66, 153, 225, 0.3); /* Shadow change on click */
        }
        /* Result display box style */
        .result-box {
            background-color: #edf2f7; /* Background color */
            border-radius: 8px;
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3748;
            text-align: center;
            position: relative; /* Needed for absolute watermark positioning */
            overflow: hidden; /* Hide watermark overflow */
        }
        /* Settings section separator */
        .settings-section {
            border-top: 1px solid #e2e8f0;
            padding-top: 30px;
            margin-top: 40px;
        }
        /* Settings grid layout */
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        /* Custom message box style */
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 1000; /* Ensure on top */
            min-width: 300px;
            text-align: center;
        }
        /* Overlay style */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent background */
            z-index: 999; /* Below message box */
        }
        /* Autocomplete suggestions styling */
        .suggestions-list {
            position: absolute;
            z-index: 10;
            background-color: white;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            width: calc(100% - 2px); /* Match input width */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 4px;
        }
        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #edf2f7;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover {
            background-color: #f0f4f8;
        }
        /* Time display style (now inside container) */
        #current-time {
            text-align: right; /* Align right within its container */
            font-size: 0.875rem; /* text-sm */
            color: #6b7280; /* gray-500 */
            font-weight: 500;
            margin-bottom: 1rem; /* Space below time */
        }
        /* PDF Watermark styles for individual areas */
        .area-watermark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Allows clicks to pass through */
            overflow: hidden; /* Hide rotated text overflow */
            z-index: 1; /* Ensure it's above content but below main elements */
        }
        .area-watermark-text {
            font-size: 14px; /* Adjusted font size for subtlety */
            color: rgba(0,0,0,0.05); /* Very light gray, low opacity */
            transform: rotate(0deg); /* Horizontal */
            white-space: nowrap; /* Prevent text wrapping */
            opacity: 0.05; /* Low opacity */
            text-align: center;
            width: 100%; /* Ensure it spans the width of its parent area-watermark */
        }
        /* New: Config Export Time Display */
        #config-export-time {
            text-align: right;
            font-size: 0.875rem; /* text-sm */
            color: #6b7280; /* gray-500 */
            font-weight: 500;
            margin-top: -0.5rem; /* Adjust spacing with current time */
            margin-bottom: 1rem;
        }
        /* New: PDF Fixed Export Timestamp */
        .pdf-fixed-timestamp {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 8px; /* Small font size */
            color: rgba(0,0,0,0.5); /* More visible than watermark but still subtle */
            z-index: 10000; /* Ensure it's above watermark */
            white-space: nowrap;
        }
    </style>
</head>
<body class="p-4">
    <!-- Price calculator main interface -->
    <div id="price-calculator" class="container">
        <!-- Current Time Display (Moved inside container) -->
        <div id="current-time"></div>
        <!-- Config Export Time Display (New) -->
        <div id="config-export-time" class="hidden"></div>

        <h1 class="text-xl font-bold text-center mb-8 text-red-600">注：26尺车 12板 24方 4500KG 以内<br>53尺车 28板 56方 18000KG 以内</h1>

        <div class="mb-8">
            <!-- Channel selections row (First Row) -->
            <!-- This grid will contain primary and optionally secondary channel dropdowns -->
            <div id="main-channel-inputs-wrapper" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                <!-- Primary Channel dropdown -->
                <!-- sm:col-span-2 for centering when single, sm:col-span-1 when twin -->
                <div id="main-primary-channel-wrap" class="input-group flex flex-col sm:col-span-2">
                    <label for="main-channel-select" class="mb-2">选择渠道:</label>
                    <select id="main-channel-select" class="p-3 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                        <!-- Channel options will be dynamically populated by JavaScript -->
                    </select>
                </div>
                <!-- Secondary Channel dropdown (smoothly transitions) -->
                <!-- sm:col-span-1 when twin, initially hidden with opacity and max-height -->
                <div id="main-sub-channel-group" class="input-group flex flex-col sm:col-span-1 transition-all duration-300 ease-in-out opacity-0 max-h-0 overflow-hidden">
                    <label for="main-sub-channel-select" class="mb-2">选择子渠道:</label>
                    <select id="main-sub-channel-select" class="p-3 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                        <!-- Sub-channel options will be dynamically populated by JavaScript -->
                    </select>
                </div>
            </div>

            <!-- Input fields row (Second Row) - Now with 3 columns for LA LOCAL Zip -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <!-- Volume input -->
                <div class="input-group flex flex-col" id="volume-input-group">
                    <label for="volume-input" class="mb-2">方量 (CBM):</label>
                    <input type="number" id="volume-input" placeholder="输入方量" step="0.01" class="p-3 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <!-- Weight input -->
                <div class="input-group flex flex-col" id="weight-input-group">
                    <label for="chargeable-weight-input" class="mb-2">重量 (KG):</label>
                    <input type="number" id="chargeable-weight-input" placeholder="输入重量" step="0.01" class="p-3 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <!-- LA LOCAL Zip Code input - Moved to the end of the row -->
                <div class="input-group flex flex-col relative" id="zip-input-group"> <!-- Added relative for absolute positioning of suggestions -->
                    <label for="la-local-zip-input" class="mb-2">LA LOCAL邮编:</label>
                    <input type="text" id="la-local-zip-input" placeholder="输入邮编" class="p-3 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                    <div id="zip-suggestions-list" class="suggestions-list hidden"></div> <!-- Suggestions list -->
                    <div id="zip-match-status" class="text-sm mt-1"></div>
                </div>
            </div>
        </div>

        <!-- Calculate button -->
        <button id="calculate-button" class="button w-full mb-8">计算价格</button>

        <div class="result-box" id="result-display">

        </div>

        <!-- Back to calculator button -->

    </div>

        // --- Utility Functions for Encryption/Decryption ---
        const TEXT_ENCODER = new TextEncoder();
        const TEXT_DECODER = new TextDecoder();
        const ALGORITHM_NAME = 'AES-GCM';
        const KEY_LENGTH = 256;
        const IV_LENGTH = 12; // AES-GCM recommended IV length
        const SALT_LENGTH = 16;
        const ITERATIONS = 100000; // Iterations for PBKDF2

        /**
         * Converts a string to a Base64 encoded string.
         * @param {Uint8Array} bytes - The byte array to encode.
         * @returns {string} Base664 encoded string.
         */
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        /**
         * Converts a Base64 encoded string to a Uint8Array.
         * @param {string} base64 - The Base64 string to decode.
         * @returns {Uint8Array} Decoded byte array.
         */
        function base64ToArrayBuffer(base64) {
            const binary_string = window.atob(base64);
            const len = binary_string.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary_string.charCodeAt(i);
            }
            return bytes;
        }

        /**
         * Derives a cryptographic key from a password and salt using PBKDF2.
         * @param {string} password - The password string.
         * @param {Uint8Array} salt - The salt byte array.
         * @returns {Promise<CryptoKey>} A promise that resolves with the derived CryptoKey.
         */
        async function deriveKey(password, salt) {
            const passwordKey = await crypto.subtle.importKey(
                'raw',
                TEXT_ENCODER.encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveBits', 'deriveKey']
            );

            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: ITERATIONS,
                    hash: 'SHA-256',
                },
                passwordKey,
                { name: ALGORITHM_NAME, length: KEY_LENGTH },
                true,
                ['encrypt', 'decrypt']
            );
        }

        /**
         * Encrypts data using AES-GCM.
         * @param {string} data - The data string to encrypt.
         * @param {string} password - The password for key derivation.
         * @returns {Promise<Object>} A promise resolving to an object with encrypted data, IV, and salt (all Base64 encoded).
         */
        async function encryptData(data, password) {
            const salt = crypto.getRandomValues(new Uint8Array(SALT_LENGTH));
            const iv = crypto.getRandomValues(new Uint8Array(IV_LENGTH));
            const key = await deriveKey(password, salt);

            const encrypted = await crypto.subtle.encrypt(
                { name: ALGORITHM_NAME, iv: iv },
                key,
                TEXT_ENCODER.encode(data)
            );

            return {
                encryptedData: arrayBufferToBase64(encrypted),
                iv: arrayBufferToBase64(iv),
                salt: arrayBufferToBase64(salt),
            };
        }

        /**
         * Decrypts data using AES-GCM.
         * @param {Object} encryptedBundle - An object containing encryptedData, IV, and salt (all Base64 encoded).
         * @param {string} password - The password for key derivation.
         * @returns {Promise<string>} A promise resolving to the decrypted data string.
         */
        async function decryptData(encryptedBundle, password) {
            const salt = base64ToArrayBuffer(encryptedBundle.salt);
            const iv = base64ToArrayBuffer(encryptedBundle.iv);
            const encryptedData = base64ToArrayBuffer(encryptedBundle.encryptedData);
            const key = await deriveKey(password, salt);

            try {
                const decrypted = await crypto.subtle.decrypt(
                    { name: ALGORITHM_NAME, iv: iv },
                    key,
                    encryptedData
                );
                return TEXT_DECODER.decode(decrypted);
            } catch (e) {
                console.error("解密失败:", e);
                throw new Error("解密失败，可能是密码不正确或文件已损坏。");
            }
        }

        /**

         * @param {string} message - The message to display.

         */
        function showMessage(message, type = 'info') {
            // Remove existing message box and overlay to prevent duplication
            const existingMessageBox = document.querySelector('.message-box');
            if (existingMessageBox) {
                existingMessageBox.remove();
            }
            const existingOverlay = document.querySelector('.overlay');
            if (existingOverlay) {
                existingOverlay.remove();
            }

            // Create and add overlay
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            document.body.appendChild(overlay);

            // Create message box
            const messageBox = document.createElement('div');
            messageBox.className = 'message-box';
            messageBox.innerHTML = `
                <p class="text-lg font-semibold mb-4">${message}</p>
                <button class="button px-6 py-2" onclick="this.parentNode.previousSibling.remove(); this.parentNode.remove();">确定</button>
            `;
            // Add styling based on message type
            if (type === 'error') {
                messageBox.querySelector('p').classList.add('text-red-600');
            } else if (type === 'success') {
                messageBox.querySelector('p').classList.add('text-green-600');
            }
            // Append message box to body
            document.body.appendChild(messageBox);
        }

        /**
         * Calculates and updates the FCL Cost and Cost per CBM display in the settings panel.
         */
        function updateCalculatedCostsDisplay() {
            const seaFreightUSD = parseFloat(settingsInputElements.seaFreightUSD.value) || 0;
            const customsClearanceUSD = parseFloat(settingsInputElements.customsClearanceUSD.value) || 0;
            const dutyUSD = parseFloat(settingsInputElements.dutyUSD.value) || 0;
            const pickupDevanningUSD = parseFloat(settingsInputElements.pickupDevanningUSD.value) || 0;
            const exchangeRate = parseFloat(settingsInputElements.exchangeRate.value) || 0;
            const seaMiscRMB = parseFloat(settingsInputElements.seaMiscRMB.value) || 0;
            const truckingRMB = parseFloat(settingsInputElements.truckingRMB.value) || 0;

            const calculatedFCLCost =
                (seaFreightUSD + customsClearanceUSD + dutyUSD + pickupDevanningUSD) * exchangeRate +
                seaMiscRMB +
                truckingRMB;

            settingsInputElements.fclCost.value = calculatedFCLCost.toFixed(2);

            // Calculate "每方成本" based on "整柜成本 / 76"
            const costPerCBM = calculatedFCLCost / 76;
            settingsInputElements.costPerCBMAdditional.value = costPerCBM.toFixed(2);
        }

        /**
         * Loads settings for a specific channel into the settings panel input fields.
         * @param {string} primaryChannelName - The primary channel name.
         * @param {string} [subChannelName=''] - The sub-channel name.
         */
        function loadSettingsForChannel(primaryChannelName, subChannelName = '') {
            const channelKey = getChannelKey(primaryChannelName, subChannelName);

            // Get settings for the specific channel, or use defaults if not found
            const currentChannelSettings = allChannelSettings[channelKey] || { ...defaultChannelSettings };

            // Populate input fields with these settings
            for (const key in settingsInputElements) {
                if (settingsInputElements.hasOwnProperty(key) && currentChannelSettings.hasOwnProperty(key)) {
                    // Only populate editable fields directly, calculated fields will be updated by updateCalculatedCostsDisplay
                    if (key !== 'fclCost' && key !== 'costPerCBMAdditional' && key !== 'profit') { // Exclude profit from auto-update by updateCalculatedCostsDisplay
                        settingsInputElements[key].value = currentChannelSettings[key].toFixed(2);
                    } else if (key === 'profit') { // Handle profit separately
                        settingsInputElements[key].value = currentChannelSettings[key] !== null && !isNaN(currentChannelSettings[key]) ? currentChannelSettings[key].toFixed(2) : '';
                    }
                }
            }
            updateCalculatedCostsDisplay(); // Update calculated FCL cost and Cost per CBM after loading
        }

        /**

         */
        function saveSettingsForChannel() {
            const primaryChannelName = settingsChannelSelect.value;
            const subChannelName = settingsSubChannelSelect.value;
            const channelKey = getChannelKey(primaryChannelName, subChannelName);

            if (!primaryChannelName) {
                showMessage("请选择一个渠道来保存设置。", "error");
                return;
            }

            // Create or update the settings object for this channel
            const currentChannelSettings = allChannelSettings[channelKey] || { ...defaultChannelSettings };

            for (const key in settingsInputElements) {
                // Save editable fields directly
                if (settingsInputElements.hasOwnProperty(key) && key !== 'fclCost' && key !== 'costPerCBMAdditional') {
                    // For profit, store null if empty string, otherwise parse float
                    currentChannelSettings[key] = (key === 'profit' && settingsInputElements[key].value === '') ? null : parseFloat(settingsInputElements[key].value) || 0;
                }
            }
            // Ensure fclCost and costPerCBMAdditional are also updated in the stored settings based on the calculation
            currentChannelSettings.fclCost = parseFloat(settingsInputElements.fclCost.value) || 0;
            currentChannelSettings.costPerCBMAdditional = parseFloat(settingsInputElements.costPerCBMAdditional.value) || 0;


            allChannelSettings[channelKey] = currentChannelSettings;

            saveAllSettingsToLocalStorage(); // Save all settings including the updated channel
            showMessage(`渠道 "${channelKey}" 的设置已保存！`, "success");
        }

        /**
         * Exports all current channel settings to an encrypted JSON file.
         */
        async function exportSettings() {
            if (!appPassword || appPassword.length === 0) {
                showMessage("请先在设置面板中设置一个访问密码才能导出配置。", "error");
                return;
            }

            try {
                const now = new Date();
                const exportDate = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')}`;

                const dataToEncrypt = JSON.stringify({
                    allChannelSettings: allChannelSettings,
                    zipCodePricingTable: zipCodePricingTable,
                    appPassword: appPassword, // Include password for import, but it's the access password
                    configExportDate: exportDate // New: Include export date
                });
                const encryptedBundle = await encryptData(dataToEncrypt, appPassword);

                const blob = new Blob([JSON.stringify(encryptedBundle)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'price_calculator_settings.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showMessage("配置已导出成功！", "success");
            }
            catch (e) {
                console.error("导出配置失败:", e);
                showMessage("导出配置失败。请检查密码或重试。", "error");
            }
        }

        /**
         * Imports and decrypts settings from a JSON file.
         */
        async function importSettings() {
            if (!appPassword || appPassword.length === 0) {
                showMessage("请先在设置面板中设置一个访问密码才能导入配置。", "error");
                return;
            }

            importFileInput.click(); // Trigger file input click

        // Handle file selection for import
        importFileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const encryptedBundle = JSON.parse(e.target.result);
                    const decryptedData = await decryptData(encryptedBundle, appPassword);
                    const importedFullSettings = JSON.parse(decryptedData);

                    console.log("导入后原始数据:", importedFullSettings); // Debugging log
                    
                    allChannelSettings = importedFullSettings.allChannelSettings || {};
                    // Crucial: Only update zipCodePricingTable if the imported one is a non-empty array.
                    // This prevents overwriting good hardcoded data with bad imported data.
                    if (Array.isArray(importedFullSettings.zipCodePricingTable) && importedFullSettings.zipCodePricingTable.length > 0) {
                        zipCodePricingTable = importedFullSettings.zipCodePricingTable.map(entry => ({
                            zipCode: String(entry.zipCode || '').trim(), // Trim spaces
                            description: String(entry.description || '').trim(), // Trim spaces
                            columnDValue: parseFloat(entry.columnDValue) || 0,
                            columnEValue: parseFloat(entry.columnEValue) || 0
                        }));
                    } else {
                        console.warn("导入的配置文件中邮编数据格式不正确或为空，将保留现有邮编数据。");
                        showMessage("导入的配置文件中邮编数据格式不正确或为空，将保留现有邮编数据。", "error");
                        // DO NOT overwrite zipCodePricingTable if it's invalid
                    }
                    console.log("导入后处理过的 zipCodePricingTable:", zipCodePricingTable); // Debugging log

                    appPassword = importedFullSettings.appPassword || '123'; // Update password from imported settings
                    configExportDate = importedFullSettings.configExportDate || ''; // New: Update configExportDate

                    saveAllSettingsToLocalStorage(); // Save to localStorage

                    showMessage("配置已成功导入！", "success");
                    // Refresh main calculator UI
                    populateChannelDropdowns(mainChannelSelect, mainPrimaryChannelWrap, mainSubChannelGroup, mainSubChannelSelect, false, mainChannelSelect.value, mainSubChannelSelect.value);
                    updateTimestampsDisplay(); // Update display after import

                } catch (e) {
                    console.error("导入配置失败:", e);
                    showMessage("导入配置失败。请确保文件未损坏且密码正确。", "error");
                } finally {
                    importFileInput.value = ''; // Clear the file input
                }
            };
            reader.readAsText(file);
        });

        // --- Core Logic Functions ---

        /**
         * Finds zip code pricing data based on the provided zip code.
         * @param {string} zipCode - The zip code to match.
         * @returns {Object|null} The matching zip code entry, or null if not found.
         */
        function findZipCodePricing(zipCode) {
            // Ensure zipCode is treated as a string for exact match and trim any potential spaces
            // Also ensure zipCodePricingTable is an array before attempting to find.
            if (!Array.isArray(zipCodePricingTable)) {
                console.error("zipCodePricingTable 不是一个数组，无法执行搜索。");
                return null;
            }
            return zipCodePricingTable.find(entry => String(entry.zipCode).trim() === String(zipCode).trim());
        }

        /**
         * Displays zip code match status and relevant column title.
         * @param {string} enteredZip - The zip code currently in the input.
         * @param {number} currentVolume - The current volume input.
         * @param {number} currentActualWeight - The current actual weight input.
         */
        function updateZipMatchStatus(enteredZip, currentVolume, currentActualWeight) {
            if (enteredZip) {
                const matchedEntry = findZipCodePricing(enteredZip);
                if (matchedEntry) {
                    let columnTitle = '';

                    // Determine which column title to display based on conditions
                    // Conditions: 当小于24立方或者4300千克以内时,取对应邮编所在行D列的值.
                    // 当小于56方 或者18000KG 以内时,取对应邮编所在行E列的值.
                    if (currentVolume < 24 || currentActualWeight < 4300) {
                        columnTitle = '26尺整车';
                    } else if (currentVolume < 56 || currentActualWeight < 18000) {
                        columnTitle = '53尺整车';
                    } else {
                        // If none of the explicit tiers are met, or if it falls outside these
                        columnTitle = '（超出价格区间）';
                    }

                    // Display B列内容 + 邮编 + 对应的列标题
                    zipMatchStatusDiv.textContent = `${matchedEntry.description} ${matchedEntry.zipCode} ${columnTitle}`;
                    zipMatchStatusDiv.style.color = 'green';
                } else {
                    zipMatchStatusDiv.textContent = '邮编未找到。';
                    zipMatchStatusDiv.style.color = 'red';
                }
            } else {
                zipMatchStatusDiv.textContent = '';
            }
        }

        /**
         * Generates and displays autocomplete suggestions for zip codes.
         * @param {string} query - The current input query.
         */
        function showZipSuggestions(query) {
            zipSuggestionsList.innerHTML = '';
            // Ensure zipCodePricingTable is an array before filtering
            if (!Array.isArray(zipCodePricingTable) || zipCodePricingTable.length === 0 || query.length < 1) { 
                zipSuggestionsList.classList.add('hidden');
                return;
            }

            const filteredZips = zipCodePricingTable.filter(entry =>
                String(entry.zipCode).trim().startsWith(query.trim()) // Trim spaces for matching
            ).slice(0, 5); // Limit to 5 suggestions

            if (filteredZips.length > 0) {
                filteredZips.forEach(entry => {
                    const suggestionItem = document.createElement('div');
                    suggestionItem.classList.add('suggestion-item');
                    // Display description if available, otherwise just zip code
                    suggestionItem.textContent = `${entry.zipCode} (${entry.description || '无描述'})`;
                    // Use mousedown instead of click for better reliability with blur event
                    suggestionItem.addEventListener('mousedown', (event) => {
                        event.preventDefault(); // Prevent input from losing focus immediately
                        laLocalZipInput.value = entry.zipCode;
                        zipSuggestionsList.classList.add('hidden'); // Hide suggestions immediately
                        // Manually trigger the input event to update status and suggestions
                        laLocalZipInput.dispatchEvent(new Event('input'));
                    });
                    zipSuggestionsList.appendChild(suggestionItem);
                });
                zipSuggestionsList.classList.remove('hidden');
            } else {
                zipSuggestionsList.classList.add('hidden');
            }
        }

        // Event listener for LA LOCAL Zip Code input
        laLocalZipInput.addEventListener('input', () => {
            const enteredZip = laLocalZipInput.value.trim();
            const currentVolume = parseFloat(volumeInput.value) || 0;
            const currentActualWeight = parseFloat(chargeableWeightInput.value) || 0;
            
            showZipSuggestions(enteredZip); // Show autocomplete suggestions
            updateZipMatchStatus(enteredZip, currentVolume, currentActualWeight); // Update match status
        });

        // Hide suggestions when input loses focus (with a slight delay to allow click on suggestion)
        laLocalZipInput.addEventListener('blur', () => {
            setTimeout(() => {
                zipSuggestionsList.classList.add('hidden');
            }, 100); 
        });

        // Update status when volume or weight changes, as it affects which column is chosen
        volumeInput.addEventListener('input', () => {
            updateZipMatchStatus(laLocalZipInput.value.trim(), parseFloat(volumeInput.value) || 0, parseFloat(chargeableWeightInput.value) || 0);
        });
        chargeableWeightInput.addEventListener('input', () => {
            updateZipMatchStatus(laLocalZipInput.value.trim(), parseFloat(volumeInput.value) || 0, parseFloat(chargeableWeightInput.value) || 0);
        });


        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadAllSettingsFromLocalStorage(); // Load all channel settings and app password first

            // Populate main calculator channel dropdowns
            populateChannelDropdowns(mainChannelSelect, mainPrimaryChannelWrap, mainSubChannelGroup, mainSubChannelSelect, false);

            // Add event listener for main channel selection
            mainChannelSelect.addEventListener('change', (event) => {
                handlePrimaryChannelChange(event, mainPrimaryChannelWrap, mainSubChannelGroup, mainSubChannelSelect, false);
            });
            mainSubChannelSelect.addEventListener('change', () => {
                // If sub-channel changes, nothing specific to do for layout, but logic might re-evaluate in calculation.
            });

            // Add event listeners for settings panel editable variable inputs to update calculated costs
            const editableSettingsKeys = ['seaFreightUSD', 'seaMiscRMB', 'truckingRMB', 'customsClearanceUSD', 'dutyUSD', 'pickupDevanningUSD', 'exchangeRate', 'profit']; // Include profit
            editableSettingsKeys.forEach(key => {
                if (settingsInputElements[key]) { // Check if element exists
                    settingsInputElements[key].addEventListener('input', updateCalculatedCostsDisplay);
                }
            });
        });

        // --- Event Listeners ---

        // Calculate button click event for main calculator
        calculateButton.addEventListener('click', () => {
            const selectedPrimaryChannelName = mainChannelSelect.value;
            const selectedSubChannelName = mainSubChannelSelect.value;
            const volume = parseFloat(volumeInput.value);
            const actualWeight = parseFloat(chargeableWeightInput.value);
            const laLocalZip = laLocalZipInput.value.trim();

            // Input validation
            if (!selectedPrimaryChannelName) {
                showMessage("请选择一个渠道。", "error");
                return;
            }
            if (isNaN(volume) || volume <= 0) {
                showMessage("请输入有效的方量。", "error");
                return;
            }
            if (isNaN(actualWeight) || actualWeight <= 0) {
                showMessage("请输入有效的重量。", "error");
                return;
            }
            if (!laLocalZip) {
                showMessage("请输入LA LOCAL邮编。", "error");
                return;
            }

            const channelKey = getChannelKey(selectedPrimaryChannelName, selectedSubChannelName);
            const currentChannelSettings = allChannelSettings[channelKey] || { ...defaultChannelSettings };

            // Validation for costPerCBMAdditional
            if (currentChannelSettings.costPerCBMAdditional === 0 || isNaN(currentChannelSettings.costPerCBMAdditional)) {
                showMessage("请先导入配置数据。", "error");
                return;
            }

            // Find zip code pricing data
            const matchedZipEntry = findZipCodePricing(laLocalZip);
            if (!matchedZipEntry) {
                showMessage("输入的LA LOCAL邮编未找到对应价格数据，请检查或导入。", "error");
                return;
            }

            let selectedZipValue = 0;
            // Conditional logic to select value from Column D or E
            // Conditions: 当小于24立方或者4300千克以内时,取对应邮编所在行D列的值.
            // 当小于56方 或者18000KG 以内时,取对应邮编所在行E列的值.
            if (volume < 24 || actualWeight < 4300) {
                selectedZipValue = matchedZipEntry.columnDValue;
            } else if (volume < 56 || actualWeight < 18000) {
                selectedZipValue = matchedZipEntry.columnEValue;
            } else {
                // If none of the explicit tiers are met, it's an error for calculation
                showMessage("当前方量或重量超出最大价格区间，无法计算。", "error");
                return;
            }

            if (selectedZipValue === 0 || isNaN(selectedZipValue)) {
                showMessage("匹配到的邮编价格数据无效，请检查配置。", "error");
                return;
            }
            
            // Calculation: 方量 * 166.66666，然后与实际重量对比，取大值作为计费重
            const volumeWeightCalculation = volume * 166.66666;
            const effectiveChargeableWeight = Math.max(volumeWeightCalculation, actualWeight);

            // Final price calculation: 
            // Part 1: 当前渠道的每方成本 * 方数 / 实际计费重
            // Part 2: (selectedZipValue * exchangeRate) / effectiveChargeableWeight
            // Total: Part 1 + Part 2
            if (effectiveChargeableWeight === 0) {
                 showMessage("计费重不能为0。", "error");
                 return;
            }
            
            let part1Cost = (currentChannelSettings.costPerCBMAdditional * volume) / effectiveChargeableWeight;
            let part2Cost = (selectedZipValue * currentChannelSettings.exchangeRate) / effectiveChargeableWeight;

            let totalCost = part1Cost + part2Cost;

            // Add profit if available
            const profitValue = parseFloat(settingsInputElements.profit.value);
            if (!isNaN(profitValue) && profitValue !== 0) {
                totalCost += profitValue;
            }

            // Display final price
            resultDisplay.textContent = `价格: ${totalCost.toFixed(2)} RMB`;
        });

        // Access settings button click event
        accessSettingsButton.addEventListener('click', () => {
            if (settingsAccessPasswordInput.value === appPassword) {
                priceCalculatorDiv.classList.add('hidden');
                settingsPanelDiv.classList.remove('hidden');
                settingsAccessPasswordInput.value = ''; // Clear password input field

                // Populate settings panel channel dropdowns
                populateChannelDropdowns(settingsChannelSelect, settingsPrimaryChannelWrap, settingsSubChannelGroup, settingsSubChannelSelect, true, mainChannelSelect.value, mainSubChannelSelect.value);

                // Add event listener for settings channel selection
                // Use the named function for removal later
                settingsChannelSelect.addEventListener('change', settingsPrimaryChannelChangeHandler);
                settingsSubChannelSelect.addEventListener('change', settingsSubChannelChangeHandler);

            } else {
                showMessage("密码错误！", "error");
            }
        });

        // Save settings button click event
        saveSettingsButton.addEventListener('click', saveSettingsForChannel);
        
        // Back to calculator button click event
        backToCalculatorButton.addEventListener('click', () => {
            settingsPanelDiv.classList.add('hidden');
            priceCalculatorDiv.classList.remove('hidden');
            // Remove settings panel specific event listeners using the named functions
            settingsChannelSelect.removeEventListener('change', settingsPrimaryChannelChangeHandler);
            settingsSubChannelSelect.removeEventListener('change', settingsSubChannelChangeHandler);

            // Also remove listeners for editable fields to prevent memory leaks
            const editableSettingsKeys = ['seaFreightUSD', 'seaMiscRMB', 'truckingRMB', 'customsClearanceUSD', 'dutyUSD', 'pickupDevanningUSD', 'exchangeRate', 'profit']; // Include profit
            editableSettingsKeys.forEach(key => {
                if (settingsInputElements[key]) { // Check if element exists
                    settingsInputElements[key].removeEventListener('input', updateCalculatedCostsDisplay);
                }
            });
        });

        // Change password button click event
        changePasswordButton.addEventListener('click', changePassword);

        // Event listeners for the newly positioned import/export buttons
        importSettingsButton.addEventListener('click', importSettings);
        exportSettingsButton.addEventListener('click', exportSettings);

        // Variable to store the imported config's export date
        let configExportDate = ''; 

        // Update current time and config export time
        function updateTimestampsDisplay() {
            const now = new Date();
            const currentTimeOptions = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            currentTimeDiv.textContent = `当前时间: ${now.toLocaleDateString('zh-CN', currentTimeOptions)}`;

            const configExportTimeDiv = document.getElementById('config-export-time');
            if (configExportDate) {
                configExportTimeDiv.textContent = `配置导出时间: ${configExportDate}`;
                configExportTimeDiv.classList.remove('hidden');
            } else {
                configExportTimeDiv.classList.add('hidden');
            }
        }
        setInterval(updateTimestampsDisplay, 1000); // Update every second
        updateTimestampsDisplay(); // Call immediately to display on load

        // New: Export to PDF functionality
        exportPdfButton.addEventListener('click', () => {
            const element = document.getElementById('price-calculator'); // The main container to export
            
            // Get or generate browser session ID
            let browserSessionId = localStorage.getItem('browserSessionId');
            if (!browserSessionId) {
                browserSessionId = crypto.randomUUID();
                localStorage.setItem('browserSessionId', browserSessionId);
            }

            // Define the areas to apply watermarks
            const watermarkAreas = [
                document.getElementById('result-display'),
                document.getElementById('volume-input-group'),
                document.getElementById('chargeable-weight-input-group'),
                document.getElementById('zip-input-group')
            ];

            const watermarksToAdd = []; // Store references to added watermarks for removal

            watermarkAreas.forEach(area => {
                if (area) {
                    const watermarkText = document.createElement('div'); // Use div for individual watermark
                    watermarkText.classList.add('area-watermark-text');
                    watermarkText.textContent = `会话ID: ${browserSessionId}`;
                    
                    // Create an overlay for each area's watermark
                    const areaWatermarkOverlay = document.createElement('div');
                    areaWatermarkOverlay.classList.add('area-watermark');
                    areaWatermarkOverlay.appendChild(watermarkText);
                    
                    area.appendChild(areaWatermarkOverlay);
                    watermarksToAdd.push(areaWatermarkOverlay); // Keep track for removal
                }
            });

            // Create fixed timestamp div
            const pdfTimestampDiv = document.createElement('div');
            pdfTimestampDiv.classList.add('pdf-fixed-timestamp');
            
            const now = new Date();
            const timestampOptions = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            pdfTimestampDiv.textContent = `导出时间: ${now.toLocaleDateString('zh-CN', timestampOptions)}`;
            element.appendChild(pdfTimestampDiv);

            // Generate PDF
            html2pdf().from(element).set({
                margin: 10,
                filename: '前端报价.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, logging: true, dpi: 192, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).save().then(() => {
                // Remove the temporary watermarks and timestamp after PDF generation is complete
                watermarksToAdd.forEach(wm => {
                    if (wm.parentNode) {
                        wm.parentNode.removeChild(wm);
                    }
                });
                element.removeChild(pdfTimestampDiv);
            });
        });
    </script>
</body>
